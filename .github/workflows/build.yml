name: Build Void-cases-v2
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build
        run: mvn --batch-mode clean package
      - name: Verify JAR
        run: |
          test -f target/void-cases-v2-3.0.0.jar
          jar tf target/void-cases-v2-3.0.0.jar | grep -E 'plugin.yml|WertyCases.class'
          unzip -p target/void-cases-v2-3.0.0.jar plugin.yml | grep -E '^name: Void-cases-v2|^version: 3.0.0|^  case:'
          sha256sum target/void-cases-v2-3.0.0.jar
      - uses: actions/upload-artifact@v4
        with:
          name: Void-cases-v2-3.0.0
          path: target/void-cases-v2-3.0.0.jar
          if-no-files-found: error
          retention-days: 30
