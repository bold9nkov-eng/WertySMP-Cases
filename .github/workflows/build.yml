name: Build WertySMP-Cases
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build
        run: mvn --batch-mode clean package
      - name: Verify JAR
        run: |
          test -f target/wertysmp-cases-2.0.1.jar
          jar tf target/wertysmp-cases-2.0.1.jar | grep -E 'plugin.yml|WertyCases.class'
          sha256sum target/wertysmp-cases-2.0.1.jar
      - uses: actions/upload-artifact@v4
        with:
          name: WertySMP-Cases-2.0.1
          path: target/wertysmp-cases-2.0.1.jar
          if-no-files-found: error
          retention-days: 30
