# WertySMP Cases — Paper 1.21.11
# Шансы независимые: каждый пункт проверяется отдельно при открытии кейса.
# min/max задают случайное количество, включая обе границы.
# Не меняй ключи материалов на русские названия: это Bukkit Material.

