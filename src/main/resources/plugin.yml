name: WertySMP-Cases
version: 2.0.1
main: ru.wertysmp.cases.WertyCases
api-version: '1.21'
author: WertySMP
description: Кейсы WertySMP с анимациями открытия и независимыми шансами наград
commands:
  wcases:
    description: Выдача кейсов WertySMP
    usage: /wcases give <игрок> <ordinary|epic|legendary> [количество]
    aliases: [wertycases, кейсы, cases, wcaces]
permissions:
  wertysmpcases.admin:
    description: Позволяет выдавать кейсы игрокам
    default: op

  dailycase:
    description: Открыть меню ежедневных наград
    usage: /dailycase
    aliases: [daily, dailycases]
